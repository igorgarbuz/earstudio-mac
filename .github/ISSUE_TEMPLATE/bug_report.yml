name: Bug report
description: Report a reproducible problem with EarStudio Companion.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before reporting. For a security vulnerability, use private reporting from the repository's Security tab instead.
        Remove device authentication keys, Bluetooth addresses, serial numbers, usernames, and personal paths from logs and screenshots. Never attach device-keys.json.
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Include the version/build number or source commit, and whether this is a release download or local build.
      placeholder: "1.0.9 (12), downloaded DMG"
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version and Mac architecture
      placeholder: "macOS 15.7.9, Apple Silicon"
    validations:
      required: true
  - type: dropdown
    id: device-model
    attributes:
      label: Device
      options:
        - ES100
        - ES100 MK2
        - Demo mode / no device
        - Other / unknown
    validations:
      required: true
  - type: input
    id: firmware-version
    attributes:
      label: Device firmware version
      description: Include the firmware version if known; write "unknown" or "not applicable" otherwise.
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the starting connection state, relevant settings, and whether another controller was open.
      placeholder: |
        1. Open the app...
        2. Connect...
        3. Change...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the exact error text if available.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics or screenshots
      description: Optional. Inspect every attachment and remove identifying information and authentication keys before posting.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I have removed secrets and personal device identifiers from this report and its attachments.
          required: true
