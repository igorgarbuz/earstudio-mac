name: Feature request
description: Suggest an improvement for EarStudio Companion.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Describe the use case and any known device or firmware limits. Protocol evidence is welcome; do not upload vendor binaries, decompiled code, authentication keys, or identifying device data.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to accomplish?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: context
    attributes:
      label: Device, firmware, and supporting evidence
      description: Optional. Link to public documentation or describe sanitized observations.
